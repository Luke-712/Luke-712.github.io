<!DOCTYPE html>
<html>
<head>
    <title>Lab 5 | Part II Custom Map</title>
    <script src="https://d3js.org/d3.v5.min.js" charset="utf-8"></script>
    <script src="https://luke-712.github.io/Lab8/us-states.JSON"></script>

    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; }
        h1, h2 { position: absolute; left: 20px; background: rgba(255,255,255,0.8); padding: 5px; border-radius: 5px; }
        h1 { top: 10px; font-size: 1.5em; }
        h2 { top: 60px; font-size: 1.1em; color: #444; min-height: 1.2em; }
        .state { stroke: #fff; stroke-width: 1; }
        .hover { fill: #ffcc00 !important; cursor: pointer; }
    </style>
</head>
<body>

    <h1>United States Population Density</h1>
    <h2 id="info">Hover over a state</h2>

    <script>
        var width = 960;
        var height = 600;

        //CHOOSE COLORS
        var lowColor = '#e0f3db';
        var highColor = '#0868ac';

        //SET RANGE
        var ramp = d3.scaleLinear().domain([0, 1000]).range([lowColor, highColor]);

        var svg = d3.select("body").append("svg")
            .attr("width", width)
            .attr("height", height);

        // Centered on US
        var projection = d3.geoAlbersUsa()
            .translate([width / 2, height / 2])
            .scale(1000);

        var path = d3.geoPath().projection(projection);

        // LOAD DATA
        d3.json("https://luke-712.github.io/Lab8/us-state2.JSON").then(function(json) {

            svg.selectAll("path")
                .data(json.features)
                .enter()
                .append("path")
                .attr("d", path)
                .attr("class", "state")
                .style("fill", function(d) {
                    // Using "density"
                    return ramp(d.properties.density || 0);
                })
                .on("mouseover", function(d) {
                    d3.select("#info").text(d.properties.name + ": " + d.properties.density + " people/sq mi");
                    d3.select(this).addClass("hover");
                })
                .on("mouseout", function(d) {
                    d3.select("#info").text("Hover over a state");
                    d3.select(this).removeClass("hover");
                });
        });

        d3.selection.prototype.addClass = function(className) {
            return this.classed(className, true);
        };
        d3.selection.prototype.removeClass = function(className) {
            return this.classed(className, false);
        };
    </script>
</body>
</html>
