<!DOCTYPE html>
<html>
<html>
<head>
<title>Lab 3</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.4/dist/leaflet.css"
crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.3.4/dist/leaflet.js"
crossorigin=""></script>
<style type="text/css">
html, body { margin: 0; padding: 0; height: 100%; }
#map { min-height: 100%; }
.legend {
    line-height: 18px;
    color: #555;
    background: white;
    background: rgba(255,255,255,0.8);
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
    border-radius: 5px;
    padding: 6px 8px;
}
.legend i {
    width: 18px;
    height: 18px;
    float: left;
    margin-right: 8px;
    opacity: 0.7;
}</style>
<script src="https://electionmaps.github.io/provinces.js"></script>
<script src="https://electionmaps.github.io/coviddata.js"></script>
</head>
<body>
<div id="map"></div>
<script type="text/javascript">
var map = L.map('map', {
center: [34.666, 104.9569],
zoom: 5
});
var imagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
});
var canvas = L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
function getColor(value) {
    return value > 50000000 ? '#54278f':
           value > 25000000 ? '#756bb1':
           value > 10000000 ? '#9e9ac8':
           value > 5000000  ? '#cbc9e2':
                              '#f2f0f7';
}
function style(feature){
    return {
        fillColor: getColor(feature.properties.POP10),   // POP10 is the population field in your data
        weight: 2,
        opacity: 1,
        color: 'gray',
        fillOpacity: 0.9
    };
}
var minValue = 500;
var minRadius = 5;

function calcRadius(val) {
    return 0.9 * Math.pow(val/minValue, .7) * minRadius;
}
var provinces = L.geoJson(provinces, {style:style}).addTo(map);
var onEachFeature = function(feature, layer) {
    if (feature.properties) {
        var prop = feature.properties;
        var popup = '<h3>' + prop['Location'] + '</h3>' + '<br>Cases Day 1: ' + prop['1'] + '<br>Cases Day 16: ' + prop['covid'];
        feature.layer = layer;
        layer.bindPopup(popup, {maxWidth: "auto"});
    }
};
var covidData = L.geoJson(covidData, {
    onEachFeature: onEachFeature,
    pointToLayer: function(feature, ll){
        return L.circleMarker(ll, {
            color: '#000000',
            opacity: 1,
            weight: 2,
            fillColor: '#808080',
            fillOpacity: .5,
            radius: calcRadius(feature.properties.covid)
        });
    }
}).addTo(map);
var basemaps = {
"Light Canvas": canvas,
"Satellite Imagery": imagery
};
var overlaymaps = {
"China Provinces ": provinces
};
L.control.layers(basemaps, overlaymaps, {collapsed:false}).addTo(map);
var legend = L.control({position: 'bottomright'});

legend.onAdd = function (map) {

    var div = L.DomUtil.create('div', 'info legend'),
        grades = [0, 5000000, 10000000, 25000000, 50000000]; // Matches your getColor function

    div.innerHTML = '<b>Population 2010 <br><br></b>';

    for (var i = 0; i < grades.length; i++) {
        div.innerHTML +=
            '<i style="background:' + getColor(grades[i] + 1) + '"></i> ' +
            grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+');
    }

    return div;
};
map.on('overlayremove', function (eventLayer) {
    if (eventLayer.name === 'China Provinces') {
        this.removeControl(legend);
    }
});

map.on('overlayadd', function (eventLayer) {
    if (eventLayer.name === 'China Provinces') {
        legend.addTo(this);
    }
});
legend.addTo(map);
</script>
</body>
</html>
